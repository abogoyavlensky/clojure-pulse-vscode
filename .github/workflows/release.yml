name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The extension reports the package.json version, so a mismatched tag
      # would publish a .vsix that claims a different version than the release.
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The pinned clj-pulse: the end-to-end tests run against the exact
      # server the release ships.
      - name: Fetch clj-pulse
        run: scripts/fetch-server.sh linux-x64

      # The jar e2e fixture (src/test/fixtures/jar-project) has no cached
      # classpath, so clj-pulse resolves it through `clojure -Spath`, which
      # needs a JDK and the Clojure CLI.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      # Warm the classpath explicitly so a resolution failure is its own
      # step, not a test timeout.
      - name: Resolve e2e fixture classpath
        run: cd src/test/fixtures/jar-project && clojure -Spath > /dev/null

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Test
        env:
          CLJ_PULSE_E2E_BIN: ${{ github.workspace }}/server/clj-pulse
        run: xvfb-run -a npm test

      - name: End-to-end (jar)
        env:
          CLJ_PULSE_E2E_BIN: ${{ github.workspace }}/server/clj-pulse
        run: xvfb-run -a npx vscode-test -l jar-e2e

      # One .vsix per platform, each carrying that platform's clj-pulse, then
      # the universal build with no server. All in one step so a failure
      # anywhere fails the whole release: it is never half published.
      - name: Package extension
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            scripts/fetch-server.sh "$target"
            npx vsce package --target "$target"
            rm -rf server
          done
          npx vsce package

      - name: Generate checksums
        run: sha256sum clojure-pulse-*.vsix > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            clojure-pulse-*.vsix
            checksums.txt

      # The GitHub Release is the source of truth, so it goes first and exists
      # even if a registry is down. Each tool reads the target platform from
      # the file's manifest, so one command publishes all six. --skip-duplicate
      # makes a re-run of an already-published version a no-op.
      # TODO: uncomment when get Azure tokens
      # - name: Publish to the VS Code Marketplace
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
      #   run: npx vsce publish --skip-duplicate --packagePath clojure-pulse-*.vsix

      # - name: Publish to Open VSX
      #   env:
      #     OVSX_PAT: ${{ secrets.OVSX_PAT }}
      #   run: npx ovsx publish --skip-duplicate --packagePath clojure-pulse-*.vsix
