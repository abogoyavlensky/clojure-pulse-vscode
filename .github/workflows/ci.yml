name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The pinned clj-pulse: the end-to-end tests run against it, and the
      # packaged .vsix carries it.
      - name: Fetch clj-pulse
        run: scripts/fetch-server.sh linux-x64

      # The jar e2e fixture (src/test/fixtures/jar-project) has no cached
      # classpath, so clj-pulse resolves it through `clojure -Spath`, which
      # needs a JDK and the Clojure CLI.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      # Warm the classpath explicitly so a resolution failure is its own
      # step, not a test timeout.
      - name: Resolve e2e fixture classpath
        run: cd src/test/fixtures/jar-project && clojure -Spath > /dev/null

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Test
        env:
          CLJ_PULSE_E2E_BIN: ${{ github.workspace }}/server/clj-pulse
        run: xvfb-run -a npm test

      - name: End-to-end (jar)
        env:
          CLJ_PULSE_E2E_BIN: ${{ github.workspace }}/server/clj-pulse
        run: xvfb-run -a npx vscode-test -l jar-e2e

      - name: Package extension
        run: npx --yes @vscode/vsce package --target linux-x64

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: clojure-pulse-vsix
          path: "*.vsix"
          if-no-files-found: error
